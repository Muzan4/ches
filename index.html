<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ches-mate</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="cheslook.css?v=3.0">
</head>
<body>
    <!-- GhostFibers Ambient Background -->
    <div id="ghost-fibers-bg" class="ghost-fibers-container" aria-hidden="true">
        <canvas class="ghost-fibers-canvas"></canvas>
    </div>

    <div class="app">
        <!-- Header -->
        <header class="app-header" id="app-header">
            <div class="header-inner">
                <div class="brand" id="brand-home" role="button" tabindex="0" title="Return to Menu">
                    <span class="brand-piece">♟</span>
                    <h1 class="brand-title">ches-mate</h1>
                </div>

                <div class="header-actions">
                    <button id="btn-sound-toggle" class="header-btn" type="button" aria-label="Toggle Sound" title="Toggle Sound">
                        <svg id="sound-icon-on" class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                        </svg>
                        <svg id="sound-icon-off" class="btn-icon is-hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <line x1="23" y1="9" x2="17" y2="15"></line>
                            <line x1="17" y1="9" x2="23" y2="15"></line>
                        </svg>
                    </button>
                    <button id="btn-header-back" class="header-btn is-hidden" type="button" title="Back to Menu">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                        <span>Menu</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Screen -->
        <main class="app-main">
            <!-- Menu Screen -->
            <section id="menu" class="screen menu-screen active">
                <div class="menu-intro">
                    <h2 class="menu-heading">Play Chess</h2>
                    <p class="menu-subheading">Select a game mode to start playing</p>
                </div>

                <div class="mode-cards-container">
                    <button id="btn-ai" class="mode-card" type="button">
                        <div class="mode-icon-box">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                                <line x1="8" y1="21" x2="16" y2="21"></line>
                                <line x1="12" y1="17" x2="12" y2="21"></line>
                            </svg>
                        </div>
                        <div class="mode-text">
                            <div class="mode-card-title">Play vs Computer</div>
                            <div class="mode-card-desc">Challenge the built-in bot as White</div>
                        </div>
                        <span class="mode-arrow">→</span>
                    </button>

                    <button id="btn-local" class="mode-card" type="button">
                        <div class="mode-icon-box">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                            </svg>
                        </div>
                        <div class="mode-text">
                            <div class="mode-card-title">Pass &amp; Play</div>
                            <div class="mode-card-desc">Two players on the same device</div>
                        </div>
                        <span class="mode-arrow">→</span>
                    </button>
                </div>
            </section>

            <!-- Game Screen -->
            <section id="game-screen" class="screen game-screen">
                <div class="game-stage">
                    <!-- Board Area -->
                    <div class="board-column">
                        <!-- Top Player (Black) -->
                        <div class="player-bar player-top" id="player-black-bar">
                            <div class="player-profile">
                                <div class="player-avatar avatar-black">♚</div>
                                <div class="player-info">
                                    <div class="player-name-row">
                                        <span class="player-name" id="name-black">Black</span>
                                        <span class="player-badge" id="badge-black">Computer</span>
                                    </div>
                                    <div class="captured-row" id="captured-by-black"></div>
                                </div>
                            </div>
                            <div class="player-turn-pill" id="status-tag-black">Thinking…</div>
                        </div>

                        <!-- Chessboard -->
                        <div class="board-frame">
                            <div id="board" class="chessboard-target"></div>
                        </div>

                        <!-- Bottom Player (White) -->
                        <div class="player-bar player-bottom" id="player-white-bar">
                            <div class="player-profile">
                                <div class="player-avatar avatar-white">♔</div>
                                <div class="player-info">
                                    <div class="player-name-row">
                                        <span class="player-name" id="name-white">White</span>
                                        <span class="player-badge" id="badge-white">Player</span>
                                    </div>
                                    <div class="captured-row" id="captured-by-white"></div>
                                </div>
                            </div>
                            <div class="player-turn-pill active" id="status-tag-white">Your Turn</div>
                        </div>
                    </div>

                    <!-- Sidebar -->
                    <aside class="game-console">
                        <!-- Status Card -->
                        <div class="console-card status-card" id="status-banner">
                            <div class="status-top-row">
                                <span class="status-dot" id="status-pulse-dot"></span>
                                <span class="status-mode" id="status-mode-label">vs Computer</span>
                            </div>
                            <div class="status-main" id="status">White to move</div>
                            <div class="status-sub" id="control-hint">Select or drag a piece to play</div>
                        </div>

                        <!-- Controls -->
                        <div class="console-card controls-card">
                            <div class="controls-grid">
                                <button id="btn-undo" class="control-btn" type="button" title="Undo Move">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M3 7v6h6"></path>
                                        <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
                                    </svg>
                                    <span>Undo</span>
                                </button>
                                <button id="btn-flip" class="control-btn" type="button" title="Flip Board">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M7 16V4M7 4L3 8M7 4L11 8M17 8v12M17 20l4-4M17 20l-4-4"/>
                                    </svg>
                                    <span>Flip</span>
                                </button>
                                <button id="btn-restart" class="control-btn" type="button" title="Restart Match">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
                                    </svg>
                                    <span>Restart</span>
                                </button>
                                <button id="btn-menu-exit" class="control-btn" type="button" title="Back to Menu">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                                    </svg>
                                    <span>Exit</span>
                                </button>
                            </div>
                        </div>

                        <!-- Move History -->
                        <div class="console-card moves-card">
                            <div class="moves-header">
                                <span class="moves-title">Moves</span>
                                <span class="move-count-badge" id="move-count-badge">0 moves</span>
                            </div>
                            <div class="moves-list-scroll" id="moves-list">
                                <div class="moves-empty" id="moves-empty">No moves played yet</div>
                            </div>
                        </div>
                    </aside>
                </div>
            </section>
        </main>

        <!-- Game Result Modal -->
        <div id="game-over-modal" class="modal-backdrop is-hidden">
            <div class="modal-box">
                <div class="modal-icon" id="modal-crest-icon">🏆</div>
                <h3 class="modal-heading" id="modal-title">Game Over</h3>
                <p class="modal-body" id="modal-message">White wins by checkmate!</p>
                <div class="modal-meta" id="modal-meta">Total moves: 24</div>
                <div class="modal-buttons">
                    <button id="modal-btn-rematch" class="btn-primary" type="button">Play Again</button>
                    <button id="modal-btn-review" class="btn-secondary" type="button">Review Board</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="ghostfibers.js?v=3.0"></script>
    <script src="ches.js?v=3.0"></script>
</body>
</html>
